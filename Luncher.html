<!DOCTYPE html>
<html>
<body style="font-family:sans-serif; text-align:center; padding-top:50px;">
    <h2>System Update Required</h2>
    <p>Please click below to continue.</p>
    
    <!-- This link triggers the batch file -->
    <a href="update.bat" id="btn" style="background-color:#4CAF50; color:white; padding:14px 20px; text-decoration:none; display:inline-block; border-radius:4px;">Update Now</a>

    <script>
        // If the user clicks, we try to trigger it again via JS to ensure it runs
        document.getElementById('btn').addEventListener('click', function() {
            window.location.href = 'update.bat';
        });
    </script>
</body>
</html>
